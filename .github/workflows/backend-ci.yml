name: Backend CI/CD

on:
  push:
    branches: [master]
    paths:
      - "strava-segments-performance-backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "strava-segments-performance-backend/**"

env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/strava-backend

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: strava-segments-performance-backend
          file: strava-segments-performance-backend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: strava-segments-performance-backend
          file: strava-segments-performance-backend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
            ${{ env.DOCKER_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Set Railway variables
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          CONNECTION_STRING: 'Host=strava-db.railway.internal;Port=5432;Database=strava_segments;Username=${{strava-db.POSTGRES_USER}};Password=${{strava-db.POSTGRES_PASSWORD}}'
        run: |
          railway variables set Strava__ClientId="$STRAVA_CLIENT_ID" \
            Strava__ClientSecret="$STRAVA_CLIENT_SECRET" \
            TokenEncryption__Key="$TOKEN_ENCRYPTION_KEY" \
            Frontend__Origin="https://frontend-production-2e86.up.railway.app" \
            ConnectionStrings__DefaultConnection="$CONNECTION_STRING" \
            ASPNETCORE_ENVIRONMENT="Production" \
            ASPNETCORE_URLS="http://+:5000" \
            --project $RAILWAY_PROJECT_ID \
            --environment $RAILWAY_ENVIRONMENT_ID \
            --service backend

      - name: Redeploy backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
        run: |
          railway redeploy --project $RAILWAY_PROJECT_ID \
            --environment $RAILWAY_ENVIRONMENT_ID \
            --service backend --yes
