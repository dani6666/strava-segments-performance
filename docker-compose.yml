version: "3.9"

services:
  postgres:
    build:
      context: ./db
      dockerfile: Dockerfile
    environment:
      POSTGRES_DB: strava_segments
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strava_user -d strava_segments"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./strava-segments-performance-backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__DefaultConnection: >-
        Host=postgres;Port=5432;Database=strava_segments;
        Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Strava__ClientId: "${STRAVA_CLIENT_ID}"
      Strava__ClientSecret: "${STRAVA_CLIENT_SECRET}"
      # Strava authorization callback domain must be set to "localhost" in Strava API settings
      TokenEncryption__Key: "${TOKEN_ENCRYPTION_KEY}"
      # Note: set "Authorization Callback Domain" to "localhost" in Strava API settings (developers.strava.com)
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./strava-segments-performance
      dockerfile: Dockerfile
    environment:
      BACKEND_ORIGIN: "http://backend:5000"
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres_data:
